services:
  - type: web
    name: hate-speech-propagation-api
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r requirements.txt
      python scripts/train_content_model.py
      python scripts/process_and_train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: HateSpeechResearchPipeline/1.0
      - key: X_BEARER_TOKEN
        sync: false
